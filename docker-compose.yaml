services:
  dot:
    build: .
    container_name: dot
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./certs:/certs:ro
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - MYSQL_SSL_CA=${MYSQL_SSL_CA}
      - MYSQL_SSL_MODE=${MYSQL_SSL_MODE}
      # Mail settings (can override DB values)
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mailhog}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_AUTH=${MAIL_AUTH:-false}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_SMTP_TLS=${MAIL_SMTP_TLS:-false}
    networks:
      - app

  db:
    image: mysql:5.7
    container_name: db
    restart: always
    volumes:
      - "./.docker/dbdata:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: A_1234567
      MYSQL_DATABASE: dotproject
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin
    container_name: myadmin
    restart: always
    ports:
      - 8088:80
    networks:
      - app

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dot-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge
